name: Regenerate games.json

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install
        working-directory: fetch-exit-game-data

      - name: Generate games.json
        run: node fetch-exit-games.js
        working-directory: fetch-exit-game-data
        env:
          BGG_BEARER_TOKEN: ${{ secrets.BGG_BEARER_TOKEN }}

      - name: Copy games.json to src/data
        run: cp fetch-exit-game-data/games.json src/data/games.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/games.json
          git commit -m "Update games.json" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
